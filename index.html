@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
:root{--pop-yellow:#FFE600;--pop-pink:#FF2E93;--pop-cyan:#00F0FF;--pop-lime:#C6FF00;--bg:#0a0a0a;--card:#141414;--text:#f5f5f5;--muted:#9a9a9a;--border:#222;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;line-height:1.6;background-image:radial-gradient(circle at 20% 20%,rgba(255,46,147,0.15) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(0,240,255,0.12) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(255,230,0,0.06) 0%,transparent 60%);background-attachment:fixed;}
.container{max-width:1050px;margin:0 auto;padding:40px 30px 80px;}

/* --- PAGE WRAPPERS --- */
.print-page{
  margin-bottom:32px;
  border-bottom:2px dashed #333;
  padding-bottom:32px;
  position:relative;
}
.print-page::after{
  content: attr(data-page);
  position:absolute;
  right:0;
  bottom:-22px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:1px;
  color:#666;
  background:#111;
  border:1px solid #222;
  padding:2px 8px;
}
.print-page:last-child{border-bottom:none; margin-bottom:0; padding-bottom:0;}
.print-page:last-child::after{display:none;}

/* --- HEADER FIX --- */
.header{
  background:var(--card);
  border:2px solid var(--border);
  border-left:8px solid var(--pop-yellow);
  padding:30px;
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  gap:20px;
  position:relative;
  overflow:visible !important;
}
.header::before{
  content:"DEV • ART • MOVEMENT";
  position:absolute;
  top:-14px;
  right:20px;
  background:var(--pop-yellow);
  color:black;
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:11px;
  padding:4px 12px;
  letter-spacing:1px;
  z-index:10;
  display:block;
  box-shadow:4px 4px 0 var(--pop-pink);
  line-height:1;
}
.header .flex{display:flex;align-items:center;gap:20px;}
.photo{width:110px;height:110px;border-radius:50%;border:3px solid var(--pop-pink);box-shadow:0 0 0 6px rgba(255,46,147,0.15),0 0 30px rgba(255,46,147,0.3);object-fit:cover;background:#222;}
.photo-fallback{width:110px;height:110px;border-radius:50%;border:3px solid var(--pop-pink);box-shadow:0 0 0 6px rgba(255,46,147,0.15),0 0 30px rgba(255,46,147,0.3);background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:32px;color:var(--pop-yellow);font-family:'JetBrains Mono',monospace;}
.image-block h1{margin:0;font-size:42px;font-weight:700;letter-spacing:-1px;line-height:1;text-transform:uppercase;background:linear-gradient(90deg,var(--text) 0%,var(--pop-cyan) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.profession{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--pop-yellow);margin-top:8px;letter-spacing:0.5px;line-height:1.5;}
.contact-info,.contact-info a{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted)!important;text-decoration:none;}
.contact-info a:hover{color:var(--pop-cyan)!important;}

.section{margin-top:32px;background:var(--card);border:1px solid var(--border);padding:28px;position:relative;}
.section.columns{display:grid;grid-template-columns:2fr 1fr;gap:0;padding:0;border:none;background:transparent;}
.section.columns .column{background:var(--card);border:1px solid var(--border);padding:28px;}
.section.columns .column:first-child{border-right:none;border-left:6px solid var(--pop-pink);}
.section.columns .column:last-child{border-left:1px dashed var(--border);}
.maintopic{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--pop-cyan);margin:0 0 18px;display:flex;align-items:center;gap:10px;}
.maintopic::before{content:"";width:12px;height:12px;background:var(--pop-yellow);display:inline-block;box-shadow:4px 4px 0 var(--pop-pink);flex-shrink:0;}
.ue-bürgerin{display:inline-block;background:var(--pop-yellow);color:black;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;padding:4px 10px;margin-bottom:12px;}
.hardskills{font-size:15px;color:var(--pop-yellow);margin:22px 0 8px;text-transform:uppercase;letter-spacing:0.5px;}
.skills ul,.hobbies ul,.portfolio-links ul{list-style:none;padding:0;margin:0;}
.skills li,.hobbies li,.portfolio-links li{padding:6px 0 6px 18px;position:relative;font-size:14px;color:#d0d0d0;}
.skills li::before{content:"▸";position:absolute;left:0;color:var(--pop-pink);font-weight:bold;}
.skills li strong{color:var(--text);}
.timeline{position:relative;padding-left:24px;border-left:2px dashed var(--border);}
.timeline-item{position:relative;margin-bottom:28px;padding:18px;background:#0e0e0e;border:1px solid #1e1e1e;border-left:3px solid var(--pop-cyan);transition:all 0.2s;}
.timeline-item:hover{border-left-color:var(--pop-pink);transform:translateX(4px);box-shadow:-8px 0 20px rgba(255,46,147,0.15);}
.timeline-item::before{content:"";width:12px;height:12px;background:var(--pop-yellow);border:2px solid var(--bg);position:absolute;left:-31px;top:22px;border-radius:50%;}
.timeline-date{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--pop-cyan);font-weight:700;margin-bottom:6px;letter-spacing:0.5px;}
.timeline-content h3{margin:0 0 6px;font-size:17px;color:var(--text);line-height:1.3;}
.timeline-content p{margin:0 0 10px;color:var(--muted);font-size:13px;}
.timeline-content ul{margin:0;padding-left:18px;}
.timeline-content li{font-size:13.5px;color:#c9c9c9;margin-bottom:4px;}
.hobbies ul{display:flex;flex-wrap:wrap;gap:10px;}
.hobbies li{background:#111;border:1px solid var(--border);border-left:3px solid var(--pop-lime);padding:10px 14px!important;font-size:13px!important;}
.hobbies li::before{display:none;}
.hobbies li:nth-child(2){border-left-color:var(--pop-pink);}
.hobbies li:nth-child(3){border-left-color:var(--pop-cyan);}
.hobbies li:nth-child(4){border-left-color:var(--pop-yellow);}
.hobbies li:nth-child(5){border-left-color:var(--pop-cyan);}
.portfolio-links{background:linear-gradient(135deg,#141414 0%,#1a1a1a 100%);border:2px solid var(--pop-yellow)!important;box-shadow:8px 8px 0 var(--pop-pink);}
.portfolio-links li{font-family:'JetBrains Mono',monospace;background:#0a0a0a;margin-bottom:10px;padding:12px 16px!important;border:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.portfolio-links li::before{display:none;}
.portfolio-links a{color:var(--pop-cyan)!important;font-weight:700;word-break:break-all;text-decoration:underline;}
.portfolio-links a:hover{color:var(--pop-yellow)!important;text-decoration:none!important;}
.Signatur{margin-top:40px;opacity:0.5;font-family:'JetBrains Mono',monospace;}
.sprachen ul{list-style:none;padding:0;margin:0;}
.sprachen li{padding:6px 0;font-size:14px;color:#d0d0d0;}

@media (max-width:768px){
  .section.columns{grid-template-columns:1fr;}
  .section.columns .column:first-child{border-right:1px solid var(--border);border-bottom:none;}
  .image-block h1{font-size:28px;}
  .container{padding:20px 16px 60px;}
  .header{padding:22px;}
  .header::before{right:12px;top:-14px!important;}
  .print-page::after{right:8px;}
}

@media print {
  body { background: white !important; background-image:none !important; color:black !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .container { padding:0 !important; max-width:100% !important; margin:0 !important; }
  .print-page { page-break-after: always; break-after: page; padding: 20px !important; min-height: 95vh; margin-bottom:0 !important; border-bottom:none !important; }
  .print-page:last-child { page-break-after: avoid; break-after: avoid; }
  .print-page::after{display:none !important;}
  .header { overflow: visible !important; border-color:#222 !important; }
